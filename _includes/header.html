{%- assign path = page.url -%}
<header class="masthead">
  <div class="wrap masthead-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="The Offer Letter, home">
      {% include logo-mark.html %}
      <span class="brand-text">
        <span class="brand-name">The Offer Letter</span>
        <span class="brand-by">Brian Piotrowski</span>
      </span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="{{ '/blog/' | relative_url }}" {% if path contains '/blog' or page.layout == 'post' %}aria-current="page"{% endif %}>Blog</a>
      <a href="{{ '/podcast/' | relative_url }}" {% if path contains '/podcast' %}aria-current="page"{% endif %}>Podcast</a>
      <a href="{{ '/about/' | relative_url }}" {% if path contains '/about' %}aria-current="page"{% endif %}>About</a>
    </nav>
  </div>
</header>
