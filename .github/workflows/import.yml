# One-time import of every blog post and image from the GoDaddy site.
# Runs only when started from the Actions tab, or when a commit message
# contains [import]. It overwrites imported posts, so don't re-run it
# after you've started editing posts here.
name: Import blog from GoDaddy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[import]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import posts and images
        run: python3 scripts/import_godaddy.py
      - name: Commit imported posts
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
          git add _posts assets/images/blog scripts/import_report.txt || true
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Import blog posts and images from GoDaddy"
            git push
          fi
